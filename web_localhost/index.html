<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MIND BEND - Fullscreen Optical Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050711;
            color: #FFFFFF;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: pointer;
            z-index: 1;
        }
        /* Glassmorphism Floating HUD */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(18, 22, 38, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 229, 255, 0.2);
            pointer-events: none;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #8E9AAF;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: #FFFFFF;
        }
        .hud-value.accent {
            color: #76FF03;
        }
        .hud-value.primary {
            color: #00E5FF;
        }
        .divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.15);
        }
        /* Place / Biome Floating Badge */
        .place-badge {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 18, 31, 0.8f);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 122, 0.4);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #FF007A;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(255, 0, 122, 0.3);
            pointer-events: none;
        }
        /* Combo Streak Popup */
        .combo-badge {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(135deg, #FF007A, #FFAB00);
            color: #FFF;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.5);
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-item">
            <span class="hud-label">Score</span>
            <span id="scoreVal" class="hud-value primary">0</span>
        </div>
        <div class="divider"></div>
        <div class="hud-item">
            <span class="hud-label">Taps</span>
            <span id="tapsVal" class="hud-value accent">0</span>
        </div>
        <div class="divider"></div>
        <div class="hud-item">
            <span class="hud-label">Highest Tap</span>
            <span id="highestVal" class="hud-value">0</span>
        </div>
    </div>

    <div id="placeBadge" class="place-badge">LOCATION: PENROSE NEXUS</div>
    <div id="comboBadge" class="combo-badge">2x MULTIPLIER (5 STREAK)</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State Variables
        let score = 0;
        let taps = 0;
        let highestTap = localStorage.getItem('highestTap') || 0;
        let gameState = 'START'; // START, PLAYING, GAME_OVER
        let currentPlaceIndex = 0;
        let comboStreak = 0;
        let multiplier = 1;
        let colorHue = 180; // Dynamic color rotation
        let angle = 0;
        let phase = 0;
        let cameraAngle = 0;
        let targetCameraAngle = 0;
        let runnerProgress = 0;
        let runnerSpeed = 0.008;

        document.getElementById('highestVal').innerText = highestTap;

        // 8 Unique Optical Illusion Biomes / Places
        const places = [
            { name: "PENROSE NEXUS", difficulty: "NORMAL", color: "#00E5FF" },
            { name: "FRASER VORTEX", difficulty: "HARD", color: "#76FF03" },
            { name: "CAFÉ WALL CORRIDOR", difficulty: "EXPERT", color: "#FF007A" },
            { name: "MOIRÉ KALEIDOSCOPE", difficulty: "INSANE", color: "#FFAB00" },
            { name: "HERMANN SCINTILLATION MATRIX", difficulty: "HARD", color: "#00E676" },
            { name: "AMES PERSPECTIVE HALLWAY", difficulty: "EXPERT", color: "#E040FB" },
            { name: "INFINITY HYPER-TUBE", difficulty: "INSANE", color: "#00B0FF" },
            { name: "QUANTUM PRISM VOID", difficulty: "GODLIKE", color: "#FF3D00" }
        ];

        // Particle & Shockwave Systems
        let particles = [];
        let shockwaves = [];

        // Pentatonic synth scale Web Audio API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        const freqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

        function playTone(tapIndex) {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = freqs[tapIndex % freqs.length] * (1 + (comboStreak % 5) * 0.05);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {}
        }

        // Tap Handler
        window.addEventListener('pointerdown', (e) => {
            if (gameState === 'START' || gameState === 'GAME_OVER') {
                gameState = 'PLAYING';
                score = 0;
                taps = 0;
                comboStreak = 0;
                multiplier = 1;
                currentPlaceIndex = 0;
                updatePlaceBadge();
            } else if (gameState === 'PLAYING') {
                taps++;
                comboStreak++;
                multiplier = Math.min(8, 1 + Math.floor(comboStreak / 4));
                score += 50 * multiplier;

                // Shift camera angle dynamically on every tap!
                targetCameraAngle += (Math.random() > 0.5 ? 45 : -45);

                // Auto Place / Location Switch every 8 taps!
                if (taps % 8 === 0) {
                    currentPlaceIndex = (currentPlaceIndex + 1) % places.length;
                    updatePlaceBadge();
                }

                playTone(taps);

                if (taps > highestTap) {
                    highestTap = taps;
                    localStorage.setItem('highestTap', highestTap);
                }

                // Spawn Particles & Shockwave
                spawnParticles(e.clientX, e.clientY);
                shockwaves.push({ x: e.clientX, y: e.clientY, r: 10, maxR: 160, a: 1 });
            }

            document.getElementById('scoreVal').innerText = score;
            document.getElementById('tapsVal').innerText = taps;
            document.getElementById('highestVal').innerText = highestTap;

            const comboBadge = document.getElementById('comboBadge');
            if (comboStreak > 1) {
                comboBadge.style.display = 'block';
                comboBadge.innerText = `${multiplier}x MULTIPLIER (${comboStreak} STREAK)`;
            } else {
                comboBadge.style.display = 'none';
            }
        });

        function updatePlaceBadge() {
            const place = places[currentPlaceIndex];
            const badge = document.getElementById('placeBadge');
            badge.innerText = `LOCATION: ${place.name} (${place.difficulty})`;
            badge.style.borderColor = place.color;
            badge.style.color = place.color;
            badge.style.boxShadow = `0 4px 20px ${place.color}66`;
        }

        function spawnParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = Math.random() * 8 + 3;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    r: Math.random() * 6 + 3,
                    a: 1,
                    hue: (colorHue + Math.random() * 60) % 360
                });
            }
        }

        // 60FPS Game Render Loop
        function gameLoop() {
            // Smooth Camera Angle Lerp
            cameraAngle += (targetCameraAngle - cameraAngle) * 0.1;
            colorHue = (colorHue + 0.5) % 360;

            const primaryColor = `hsl(${colorHue}, 100%, 50%)`;
            const secondaryColor = `hsl(${(colorHue + 120) % 360}, 100%, 50%)`;
            const accentColor = `hsl(${(colorHue + 240) % 360}, 100%, 50%)`;

            ctx.fillStyle = '#050711';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            angle += 0.025;
            phase += 0.05;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(cameraAngle * Math.PI / 180);

            // Draw Dynamic Optical Illusion Biome Background
            if (currentPlaceIndex === 0) {
                // Penrose Nexus Loops
                ctx.rotate(angle);
                for (let i = 0; i < 5; i++) {
                    ctx.strokeStyle = i % 2 === 0 ? primaryColor : secondaryColor;
                    ctx.lineWidth = 10 - i * 1.5;
                    ctx.beginPath();
                    const r = 160 - i * 28;
                    ctx.moveTo(0, -r);
                    ctx.lineTo(-r * 0.86, r * 0.5);
                    ctx.lineTo(r * 0.86, r * 0.5);
                    ctx.closePath();
                    ctx.stroke();
                }
            } else if (currentPlaceIndex === 1) {
                // Fraser Vortex
                ctx.rotate(-angle * 1.2);
                for (let r = 30; r < 240; r += 20) {
                    ctx.strokeStyle = r % 40 === 0 ? primaryColor : accentColor;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            } else if (currentPlaceIndex === 2) {
                // Café Wall Corridor
                for (let row = -6; row <= 6; row++) {
                    const y = row * 40;
                    const offset = Math.sin(phase + row) * 30;
                    ctx.strokeStyle = primaryColor;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-cx, y);
                    ctx.lineTo(cx, y);
                    ctx.stroke();
                }
            } else if (currentPlaceIndex === 3) {
                // Moiré Speedway
                ctx.rotate(angle);
                for (let i = 0; i < 36; i++) {
                    const a = (Math.PI * 2 * i) / 36;
                    ctx.strokeStyle = primaryColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * cx, Math.sin(a) * cy);
                    ctx.stroke();
                }
            } else if (currentPlaceIndex === 4) {
                // Hermann Grid
                for (let x = -3; x <= 3; x++) {
                    for (let y = -3; y <= 3; y++) {
                        ctx.fillStyle = secondaryColor;
                        ctx.fillRect(x * 80 - 15, y * 80 - 15, 30, 30);
                    }
                }
            } else if (currentPlaceIndex === 5) {
                // Ames Perspective
                for (let depth = 1; depth <= 6; depth++) {
                    const size = depth * 45 + Math.sin(phase + depth) * 15;
                    ctx.strokeStyle = depth % 2 === 0 ? primaryColor : accentColor;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(-size, -size * 1.3, size * 2, size * 2.6);
                }
            } else if (currentPlaceIndex === 6) {
                // Infinity Hyper-Tube
                ctx.rotate(angle * 1.5);
                for (let i = 1; i <= 8; i++) {
                    const r = i * 28;
                    ctx.strokeStyle = primaryColor;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    for (let s = 0; s < 6; s++) {
                        const a = (Math.PI * 2 * s) / 6;
                        const px = Math.cos(a) * r;
                        const py = Math.sin(a) * r;
                        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            } else {
                // Quantum Prism Void
                ctx.rotate(angle * 2);
                for (let i = 0; i < 12; i++) {
                    ctx.strokeStyle = `hsl(${(colorHue + i * 30) % 360}, 100%, 50%)`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(0, 0, i * 20, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            ctx.restore();

            // Draw Infinite Runner Track
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = primaryColor;
            ctx.lineWidth = 14;
            ctx.shadowColor = primaryColor;
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.moveTo(0, -cy * 0.8);
            ctx.lineTo(0, cy * 0.8);
            ctx.stroke();

            // Glowing Orb Runner
            const runnerY = cy * 0.4 * Math.sin(phase * 0.8);
            ctx.fillStyle = accentColor;
            ctx.shadowColor = accentColor;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(0, runnerY, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Draw Shockwaves
            shockwaves.forEach((s, idx) => {
                s.r += 6;
                s.a -= 0.025;
                if (s.a <= 0) shockwaves.splice(idx, 1);
                else {
                    ctx.strokeStyle = `rgba(118, 255, 3, ${s.a})`;
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });

            // Draw Particles
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.a -= 0.02;
                if (p.a <= 0) particles.splice(idx, 1);
                else {
                    ctx.fillStyle = `hsla(${p.hue}, 100%, 50%, ${p.a})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Screen Start/GameOver Overlay
            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(5, 7, 17, 0.65)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '900 48px Segoe UI';
                ctx.fillText('MIND BEND', cx, cy - 40);

                ctx.font = '800 16px Segoe UI';
                ctx.fillStyle = '#00E5FF';
                ctx.fillText('FULLSCREEN OPTICAL ILLUSION RUNNER', cx, cy);

                ctx.font = '900 18px Segoe UI';
                ctx.fillStyle = '#76FF03';
                ctx.fillText('★ TAP ANYWHERE TO RUN ★', cx, cy + 60);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
